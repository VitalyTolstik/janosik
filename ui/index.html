<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `%BASE_URL%` is the Vite base (`/app/` in the self-host image, `/`
         standalone), so the app boots correctly from any sub-path. -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="mask-icon" href="%BASE_URL%icon.svg" color="#2563eb" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Janosik — a self-hosted, offline-first Kanban board with drag & drop, undo/redo, WIP limits and i18n."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#0b1220" />
    <title>Janosik — Boards</title>
    <script>
      /*
       * Theme preflight — runs before first paint so the persisted theme is
       * applied without a dark/light flash. Precedence: saved preference >
       * system preference. It cannot import the app bundle (that loads
       * later), so the storage keys are duplicated here as literals on
       * purpose and kept in sync with src/utils/storage-keys.ts.
       */
      (function () {
        try {
          var saved = localStorage.getItem("janosik-theme");
          if (saved === null) {
            var legacy = localStorage.getItem("vortex-theme");
            if (legacy !== null) {
              try {
                localStorage.setItem("janosik-theme", legacy);
              } catch (e) {}
              try {
                localStorage.removeItem("vortex-theme");
              } catch (e) {}
              saved = legacy;
            }
          }
          var dark =
            saved === "light" || saved === "dark"
              ? saved === "dark"
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.classList.toggle("light", !dark);
        } catch (e) {}
      })();
    </script>
    <style id="__janosik_preflight">
      /*
       * Pre-paint kill-switch: no color transition on the very first frame,
       * and a themed backdrop before index.css loads. The hex literals are
       * unavoidable here — this runs before the design tokens exist.
       * App.tsx removes this element once React has painted.
       */
      * {
        transition: none !important;
      }
      html {
        background: #0b1220;
      }
      html.light {
        background: #f4f5f6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Janosik — static hosting contract (TASK-21.8, TASK-123).
#
# The self-host image serves the frontends from the API process itself
# (`backend/src/common/serve-frontends.ts`) — no nginx is required. This file
# is the equivalent contract for deployments that put nginx (or another proxy)
# in front. Keep it in sync with that implementation.
#
# Layout: the marketing site + docs own `/`, the app (React SPA) lives under
# `/app/`, the API under `/api/v1`.
#
#   /            → site/dist  (Astro: landing, /pricing, /docs, …)
#   /app/…       → ui/dist    (SPA; unknown paths fall back to its shell)
#   /app/s/…     → ui/dist    (public share pages: framable, unindexed)
#   /api/…       → the backend process
#
# Include this file in the `http` context (e.g. /etc/nginx/conf.d/).

# Cache policy by path. Set once at server level instead of per location:
# nginx drops every inherited `add_header` in a location that declares its
# own, which would silently strip the security headers below.
map $uri $janosik_cache_control {
  default "";
  # Shells, the service worker and the build manifest must be revalidated: a
  # cached copy pins the old hashed asset URLs after a deploy.
  /index.html "no-cache";
  /app/ "no-cache";
  /app/index.html "no-cache";
  /app/sw.js "no-cache";
  /app/version.json "no-cache";
  # Content-hashed build output is immutable — cache it for a year.
  ~^/_astro/ "public, max-age=31536000, immutable";
  ~^/app/assets/ "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;

  # Marketing site + docs at the root.
  root /usr/share/nginx/html;
  index index.html;

  # Commands (2 MB), board imports (5 MB) and attachments (25 MB) all go
  # through here; nginx's 1 MB default would refuse them with a 413.
  client_max_body_size 30m;

  add_header Cache-Control $janosik_cache_control;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # API + SSE to the backend (its own security headers come from helmet).
  location /api/ {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off; # SSE must stream
    proxy_read_timeout 3600s;
  }

  # App (SPA) under /app/, assets and shell included. BrowserRouter deep
  # links fall back to the shell, which this same location serves.
  location /app/ {
    alias /usr/share/nginx/html-app/;
    try_files $uri $uri/ /app/index.html;
  }

  # Public read-only board shares (TASK-58): same SPA shell, but "only by
  # link" — never indexed — and deliberately framable so `?embed=1` can be
  # embedded in a third-party page (hence no X-Frame-Options here). The shell
  # is served by a `rewrite … break` that stays in this location: a try_files
  # fallback would redirect into `/app/` and pick up its headers instead.
  # Declaring add_header resets inheritance, so the others are repeated.
  location ^~ /app/s/ {
    root /usr/share/nginx/html-app;
    rewrite ^ /index.html break;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Unknown site paths → the site's 404 page.
  location / {
    try_files $uri $uri/ =404;
  }
}

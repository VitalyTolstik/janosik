# Janosik — static SPA hosting (TASK-21.8).
#
# Minimal contract for serving the built `dist/` behind BrowserRouter:
# any unknown path must return index.html (never a 404), so deep links
# like /board/:id and ?card= survive a direct load or a page refresh.
# The PWA service worker additionally replays the cached shell offline.
#
# The full self-host stack (docker compose, API proxy, SSE buffering,
# TLS) is configured in TASK-38 — this file stays the single source of
# the routing contract.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html; # the contents of dist/
  index index.html;

  # BrowserRouter deep links: unknown paths fall back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The app shell must be revalidated: a cached copy pins the old hashed
  # asset URLs after a deploy (mixed-version load).
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The worker must be revalidated too, otherwise a returning browser keeps
  # running the previous deploy's service worker.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Content-hashed build output is immutable — cache it for a year.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}

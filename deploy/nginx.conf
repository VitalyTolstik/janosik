# Janosik — static hosting contract (TASK-21.8, TASK-123).
#
# The self-host image serves the frontends from the API process itself
# (`backend/src/common/serve-frontends.ts`) — no nginx is required. This file
# is the equivalent contract for deployments that put nginx (or another proxy)
# in front. Keep it in sync with that implementation.
#
# Layout: the marketing site + docs own `/`, the app (React SPA) lives under
# `/app/`, the API under `/api/v1`.
#
#   /            → site/dist  (Astro: landing, /pricing, /docs, …)
#   /app/…       → ui/dist    (SPA; unknown paths fall back to its shell)
#   /app/s/…     → ui/dist    (public share pages: framable, unindexed)
#   /api/…       → the backend process
#
# Include this file in the `http` context (e.g. /etc/nginx/conf.d/).
# Deployment prerequisite: generate the required CSP include from the exact
# builds mounted below, then pass nginx -t before starting/reloading nginx.
include /etc/nginx/janosik-csp.conf;

# Preserve Helmet's upstream headers. Supply them on edge-generated errors
# (e.g. 413 or 502) and other API responses without an upstream policy.
map $upstream_http_strict_transport_security $janosik_api_hsts {
  "" "max-age=31536000; includeSubDomains";
  default "";
}

map $uri $janosik_hsts {
  ~^/api/ $janosik_api_hsts;
  default "max-age=31536000; includeSubDomains";
}

# Cache policy by path. Set once at server level instead of per location:
# nginx drops every inherited `add_header` in a location that declares its
# own, which would silently strip the security headers below.
map $uri $janosik_cache_control {
  default "";
  # Shells, the service worker and the build manifest must be revalidated: a
  # cached copy pins the old hashed asset URLs after a deploy.
  /index.html "no-cache";
  /app/ "no-cache";
  /app/index.html "no-cache";
  /app/sw.js "no-cache";
  /app/version.json "no-cache";
  # Content-hashed build output is immutable — cache it for a year.
  ~^/_astro/ "public, max-age=31536000, immutable";
  ~^/app/assets/ "public, max-age=31536000, immutable";
}

# Use the final URI after the site fallback resolves. Asset errors should
# keep the same cache policy as before.
map "$status:$uri" $janosik_site_error_cache_control {
  default "";
  "404:/404.html" "no-cache";
  "404:/index.html" "no-cache";
}

server {
  listen 8080;
  server_name _;

  # Marketing site + docs at the root.
  root /usr/share/nginx/html;
  index index.html;

  # Commands/plans (10 MB), board imports (25 MB) and attachments (25 MB) all
  # go through here; nginx's 1 MB default would refuse them with a 413.
  client_max_body_size 30m;

  add_header Cache-Control $janosik_cache_control;
  add_header Cache-Control $janosik_site_error_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy $janosik_csp always;
  add_header Strict-Transport-Security $janosik_hsts always;

  # API + SSE to the backend (its own security headers come from helmet).
  location /api/ {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off; # SSE must stream
    proxy_read_timeout 3600s;
  }

  # App (SPA) under /app/, assets and shell included. BrowserRouter deep
  # links fall back to the shell, which this same location serves.
  location = /app {
    absolute_redirect off;
    return 301 /app/$is_args$args;
  }

  location /app/ {
    alias /usr/share/nginx/html-app/;
    try_files $uri $uri/ /app/index.html;
  }

  # Public read-only board shares (TASK-58): same SPA shell, but "only by
  # link" — never indexed — and deliberately framable so `?embed=1` can be
  # embedded in a third-party page (hence no X-Frame-Options here). The shell
  # is served by a `rewrite … break` that stays in this location: a try_files
  # fallback would redirect into `/app/` and pick up its headers instead.
  # Declaring add_header resets inheritance, so the others are repeated.
  location ^~ /app/s/ {
    root /usr/share/nginx/html-app;
    rewrite ^ /index.html break;
    add_header Content-Security-Policy $janosik_share_csp always;
    add_header Strict-Transport-Security $janosik_hsts always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Keep status 404 and use the same branded fallback as the Node server.
  location / {
    error_page 404 =404 @site_not_found;
    try_files $uri $uri/ =404;

    # A directory without an index (for example /screens/) is also a
    # missing page. Keep nginx's slash redirect for bare directory paths.
    location ~ /$ {
      try_files ${uri}index.html =404;
    }
  }

  location @site_not_found {
    try_files /404.html /index.html =404;
  }
}

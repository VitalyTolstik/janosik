# Janosik — nginx main config for the scaled proxy (TASK-200.12).
#
# Mounted by docker-compose.scale.yml at /etc/nginx/nginx.conf. The stock
# nginx image's main config caps `worker_connections` at 1024, which would give
# roughly 2k streams on one worker and fewer than the documented 6k/20k
# cluster ceilings once the proxy holds both the client and the upstream SSE
# connection. This full config raises the ceiling and the file-descriptor
# limit; the server/proxy contract stays in deploy/scale/nginx.conf (mounted
# into conf.d).
#
# 65 536 connections per worker × 4 workers covers the 16 vCPU profile
# (4 × 20 000 streams × 2 connections = 160k), and is limited by
# worker_rlimit_nofile below and the container's nofile ulimit.
user nginx;
# Four workers is enough for the 6k/20k stream profiles and keeps nginx's
# per-worker memory/CPU predictable inside a small proxy container.
worker_processes 4;
worker_rlimit_nofile 131072;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 65536;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # Downstream write timeout (time between two writes to the client). The
    # default 60 s would cut a PAT SSE stream whose keep-alive is 60 s plus up
    # to 6 s of jitter; the SSE location raises it to 3600 s explicitly.
    send_timeout 120s;
    server_tokens off;

    # The proxy contract: upstream, gzip, SSE/no-buffering, upload routes and
    # the frontend forwarding.
    include /etc/nginx/conf.d/*.conf;
}

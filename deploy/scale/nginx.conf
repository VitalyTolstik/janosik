# Janosik — nginx front for 2–4 API replicas (TASK-200.12).
#
# Mounted by docker-compose.scale.yml at /etc/nginx/conf.d/default.conf and
# included in the http context; the full main config (worker_connections,
# worker_rlimit_nofile) is deploy/scale/nginx-main.conf. It replaces the
# single-container port binding: the proxy is the only public listener, and the
# `app` service alias resolves to every replica on the Compose network.
#
# Contract:
#   - round-robin across all healthy replicas, no sticky sessions;
#   - gzip for uncompressed text/JSON; an API response that already carries
#     Content-Encoding (board reads negotiate gzip/Brotli themselves) passes
#     through untouched;
#   - SSE (`text/event-stream`) is never buffered; read/send timeouts are far
#     above the 60 s PAT keep-alive and 25 s human keep-alive;
#   - `?since=` query strings are preserved verbatim, so a reconnect can land
#     on a different replica and still replay the command log;
#   - uploads and static assets are served by each replica from the shared
#     image/volume; the proxy only forwards (no local document root);
#   - a proxy reload after scaling picks up the new replica IPs. Until then
#     `proxy_next_upstream` retries a request whose replica has gone away.
#
# Validate: nginx -t (add a hosts entry for `app` if validating outside
# Compose). Reload after a scale/rollout: docker compose ... exec proxy \
#   nginx -s reload

# Preserve the scheme an external TLS proxy already established; direct
# clients reach this proxy over HTTP, so the fallback is $scheme.
map $http_x_forwarded_proto $janosik_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# All replicas share the Compose DNS name `app`; nginx resolves every A record
# at startup and round-robins them. keepalive reuses upstream connections.
upstream janosik_api {
    # Shared state: one failure/success accounting table for every worker.
    zone janosik_api 64k;
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Content-hashed static output (site `/_astro/*`, app `/app/assets/*`) is
# immutable and identical on every replica. Cache it at the proxy so a redeploy
# of assets does not hit every replica for every browser request. Only those
# two prefixes use this zone; HTML shells, `sw.js` and uploads are never cached.
proxy_cache_path /var/cache/nginx/janosik levels=1:2
    keys_zone=janosik_static:32m max_size=1g inactive=7d use_temp_path=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Attachments (25 MB), board imports (25 MB), command/plan bodies (10 MB)
    # and large commands (2 MB). The API enforces the real per-route caps.
    client_max_body_size 30m;

    # Compress only what the upstream sent as identity. nginx leaves an
    # existing Content-Encoding/Vary alone; `gzip_vary` advertises the
    # representation to caches. SSE is text/event-stream and is not compressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # Proxy health: hit a replica's readiness probe, not just nginx itself, so
    # an unhealthy replica set keeps the container unhealthy too. The probe is
    # cached by the API for 2 s and is exempt from rate limiting.
    location = /healthz {
        access_log off;
        proxy_pass http://janosik_api/api/v1/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        # If one replica is not ready, ask another before failing the probe.
        proxy_next_upstream error timeout http_503;
        proxy_next_upstream_tries 0;
    }

    # SSE (`boards/:id/events`, `share/:token/events`) has its own location:
    # it must never buffer and must outlive the 60 s PAT / 25 s human keep-alive
    # by far, while ordinary API calls keep a normal 60 s timeout below.
    location ~ ^/api/v1/(?:boards/[^/]+|share/[^/]+)/events/?$ {
        proxy_pass http://janosik_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $janosik_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Encoding $http_accept_encoding;

        proxy_buffering off;
        proxy_cache off;
        # `proxy_read/send_timeout` cover the upstream; `send_timeout` is the
        # downstream client write. PAT keep-alive is 60 s + 0–6 s jitter, so
        # nginx's default 60 s downstream timeout would cut roughly half of
        # those streams before the next frame.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503;
        # A 3–4 replica rollout may leave several stale addresses; try every
        # upstream rather than giving up after two.
        proxy_next_upstream_tries 0;
        proxy_next_upstream_timeout 10s;
    }

    # Normal API requests. Buffering stays off (the route set includes uploads,
    # downloads and small framed responses); 90 s covers the 60 s ready
    # long-poll with margin and no longer hides a stuck API call for an hour.
    location /api/ {
        proxy_pass http://janosik_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $janosik_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Preserve the client's negotiation. The backend compresses the large
        # board payloads itself and sets Vary: Accept-Encoding; nginx then
        # sees an encoded response and does not gzip it a second time.
        proxy_set_header Accept-Encoding $http_accept_encoding;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 5s;

        # A replica may be restarting during a rollout. Retry every other
        # upstream on connect/timeout/502/503; never retry a non-idempotent
        # write whose request body nginx already sent (the default excludes
        # that).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 0;
        proxy_next_upstream_timeout 10s;
    }

    # Content-hashed static assets. Their names change on every build, so a
    # 7-day cache is safe; a slow/erroring replica can serve a stale copy while
    # the cache revalidates. HTML shells and `sw.js` stay on the `/` path below
    # and are never cached.
    location ~ ^/(?:_astro|app/assets)/ {
        proxy_pass http://janosik_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $janosik_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Encoding $http_accept_encoding;

        proxy_cache janosik_static;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502
            http_503 http_504;
        add_header X-Proxy-Cache $upstream_cache_status;
        proxy_buffering on;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 0;
    }

    # Static SPA/site and uploads. These can be buffered: hashed assets and
    # file downloads are large and are sent in one piece. The upstream's
    # Cache-Control/ETag headers are preserved, so immutable hashed assets
    # still cache for a year.
    location / {
        proxy_pass http://janosik_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $janosik_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Encoding $http_accept_encoding;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 32k;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 0;
    }

    # Uploads, attachment reads and avatar reads/writes may be large and slow;
    # let them finish rather than timing out at the static 60 s read timeout.
    # (The API still enforces auth and its own per-route limits.)
    location ~ ^/api/v1/(?:cards/[^/]+/attachments|users/(?:me|[^/]+)/avatar|boards/import|attachments/[^/]+/(?:content|thumbnail|poster))/?$ {
        proxy_pass http://janosik_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $janosik_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
    }
}

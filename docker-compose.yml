# Janosik — self-host stack (TASK-38b).
#
# Quick start:
#   curl -O https://raw.githubusercontent.com/VitalyTolstik/janosik/main/docker-compose.yml
#   curl -o .env https://raw.githubusercontent.com/VitalyTolstik/janosik/main/.env.example
#   # edit .env: set JWT_SECRET (openssl rand -hex 32) and PUBLIC_ORIGIN;
#   # for a plain-HTTP trial also set COOKIE_SECURE=false (see the app block)
#   docker compose up -d
#   # → open PUBLIC_ORIGIN, create the first account, then close registration
#
# Upgrade:  docker compose pull && docker compose up -d   (migrations run on boot)
# Backup:   docker compose exec postgres pg_dump -U janosik janosik > backup.sql

services:
  app:
    image: ghcr.io/vitalytolstik/janosik:${JANOSIK_TAG:-latest}
    # Uncomment to build the image from this checkout instead of pulling:
    # build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # One origin for the site, the app and the API: the image serves all
      # three. The marketing site owns `/`, the app lives under `/app/`.
      STATIC_DIR: /app/public
      SITE_DIR: /app/site
      UI_BASE: /app/
      UPLOAD_DIR: /data/uploads
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-200}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32)}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      # Secure by default (TASK-147, B13): the refresh cookie is Secure unless
      # the operator explicitly opts out. A production install served over
      # plain HTTP refuses to boot with this on, so the HTTP *trial* below
      # must set COOKIE_SECURE=false — a visible, deliberate risk, not a
      # silent default.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # 0 = no proxy in front (the port is published directly). Set to 1 when
      # you put nginx/Caddy/Traefik in front, so rate limits and the audit log
      # see the real client IP.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Retention: soft-deleted rows (and whole boards) older than the first
      # window are purged; the master audit trail keeps a longer one (TASK-148).
      PURGE_AFTER_DAYS: ${PURGE_AFTER_DAYS:-30}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      # Optional: Redis-backed queues are on via REDIS_URL above; the dashboard
      # is OWNER-only and off unless enabled.
      QUEUES_DASHBOARD: ${QUEUES_DASHBOARD:-false}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - janosik-uploads:/data/uploads
    # The image ships the same probe; declared here too so `docker compose ps`
    # shows the app's health alongside postgres/redis. It checks the API
    # readiness probe and the site root (the baked marketing site).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const p=process.env.PORT||3000;Promise.all(['/api/v1/health/ready','/'].map(u=>fetch('http://127.0.0.1:'+p+u))).then(rs=>process.exit(rs.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    # TASK-153 (B14): the stock container starts with 16 MB shared buffers
    # and 4 MB work_mem, so every aggregation round-trips to disk. Sized for a
    # small self-host by default; raise with the env knobs on a bigger box.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - janosik-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - janosik-redisdata:/data

volumes:
  janosik-pgdata:
  janosik-redisdata:
  janosik-uploads:

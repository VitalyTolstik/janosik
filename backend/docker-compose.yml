# Janosik backend — postgres 16 (dev DB `janosik`, test DB `janosik_test`).
# Credentials come from backend/.env (see .env.example) — nothing secret
# is committed here.
# USAGE: docker compose -f backend/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: janosik-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
    ports:
      # 5433 — avoids clashing with a local postgres on 5432
      - "5433:5432"
    volumes:
      - janosik-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/01-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  janosik-pgdata:

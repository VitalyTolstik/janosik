              - delete_card
              - delete_column
              - delete_label
              - delete_checklist
              - delete_checklist_item
              - archive_column_cards
              - delete_board
              - member.invite
              - member.update
              - member.remove
              - share.create
              - share.update
              - share.revoke
              - share.delete
              - attachment.delete
              - workflow.update

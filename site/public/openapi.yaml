          maxItems: 1
        maxCommandsPerRun:
          type: integer
          minimum: 1
          maximum: 100
        maxCardsPerRun:
          type: integer
          minimum: 1
          maximum: 50
        approvalTtlMinutes:
          type: integer
          minimum: 5
          maximum: 1440

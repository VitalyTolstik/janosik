          type: [string, "null"]
    RequestAccountDeletionCodeRequest:
      type: object
      properties:
        oauthProof:
          type: string
          description: OAuth-issued access token no older than ten minutes.
    RequestAccountDeletionCodeResponse:
      type: object
      required: [expiresAt, queued]
      properties:
        expiresAt:
          type: integer
        queued:
          type: boolean
    DeleteAccountRequest:
      type: object
      required: [confirmEmail]
      properties:
        password:
          type: string
        oauthProof:
          type: string
        emailCode:
          type: string
          pattern: "^[0-9]{6}$"
        confirmEmail:
          type: string
    DeleteAccountResponse:
      type: object
      required: [status, deleteAfter]
      properties:
        status:
          type: string
          const: scheduled
        deleteAfter:
          type: integer
    AnnouncementDto:
      type: object
      description: One active in-app announcement as the signed-in user sees it.
      required:
        [
          id,
          title,
          body,
          level,
          contentLocale,
          requestedLocale,
          isFallback,
          version,
        ]
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        level:
          type: string
          enum: [info, warning, danger]
        contentLocale:
          type: [string, "null"]
          enum: [en, ru, null]
          description: Language of the returned text; null for a legacy row.
        requestedLocale:
          type: string
          enum: [en, ru]
        isFallback:
          type: boolean
          description: True when the UI must show the "available only in …" notice.
        version:
          type: integer
          minimum: 1
          description: |
            Current announcement version. Send it back to
            `POST /announcements/{id}/dismiss`; a later edit
            increments it and shows the banner again.
    AnnouncementDismissRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: The `AnnouncementDto.version` the banner showed.
    AnnouncementDismissResponse:
      type: object
      required: [dismissed, version]
      properties:
        dismissed:
          type: boolean
          const: true
        version:
          type: integer
          minimum: 1
          description: The version recorded as dismissed for the caller.

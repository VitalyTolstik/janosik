    BoardAction:
      description: |
        Reducer action posted inside a command. `at` and the action-level
        `boardId` are transport context: the server stamps them, and the plan
        hash excludes them. All action types accepted by the shared validator
        are listed; the `Restore*`/`Import*`/`Add*`/`Remove*` types are
        browser undo/import operations and are refused to a PAT. Field-level
        detail for those legacy actions is in the Command API docs.
      oneOf:
        - $ref: "#/components/schemas/ActionAddCard"
        - $ref: "#/components/schemas/ActionUpdateCard"
        - $ref: "#/components/schemas/ActionTouchCard"
        - $ref: "#/components/schemas/ActionMoveCard"
        - $ref: "#/components/schemas/ActionArchiveCard"
        - $ref: "#/components/schemas/ActionUnarchiveCard"
        - $ref: "#/components/schemas/ActionDeleteCard"
        - $ref: "#/components/schemas/ActionDuplicateCard"
        - $ref: "#/components/schemas/ActionSetCardDueDate"
        - $ref: "#/components/schemas/ActionSetCardPriority"
        - $ref: "#/components/schemas/ActionSetCardAssign"
        - $ref: "#/components/schemas/ActionSetCardTaskSpec"
        - $ref: "#/components/schemas/ActionSetCardLabel"
        - $ref: "#/components/schemas/ActionSetCardCover"
        - $ref: "#/components/schemas/ActionClaimCard"
        - $ref: "#/components/schemas/ActionAddCardLink"
        - $ref: "#/components/schemas/ActionRemoveCardLink"
        - $ref: "#/components/schemas/ActionAddColumn"
        - $ref: "#/components/schemas/ActionRenameColumn"
        - $ref: "#/components/schemas/ActionDeleteColumn"
        - $ref: "#/components/schemas/ActionMoveColumn"
        - $ref: "#/components/schemas/ActionDuplicateColumn"
        - $ref: "#/components/schemas/ActionSortColumn"
        - $ref: "#/components/schemas/ActionSetColumnCardOrder"
        - $ref: "#/components/schemas/ActionSetColumnWipLimit"
        - $ref: "#/components/schemas/ActionSetColumnAccent"
        - $ref: "#/components/schemas/ActionArchiveColumnCards"
        - $ref: "#/components/schemas/ActionAddLabel"
        - $ref: "#/components/schemas/ActionRenameLabel"
        - $ref: "#/components/schemas/ActionSetLabelColor"
        - $ref: "#/components/schemas/ActionDeleteLabel"
        - $ref: "#/components/schemas/ActionAddChecklist"
        - $ref: "#/components/schemas/ActionRenameChecklist"
        - $ref: "#/components/schemas/ActionDeleteChecklist"
        - $ref: "#/components/schemas/ActionAddChecklistItem"
        - $ref: "#/components/schemas/ActionSetChecklistItemDone"
        - $ref: "#/components/schemas/ActionRenameChecklistItem"
        - $ref: "#/components/schemas/ActionDeleteChecklistItem"
        - $ref: "#/components/schemas/ActionRenameBoard"
        - $ref: "#/components/schemas/ActionSetBoardColumnStyle"
        - $ref: "#/components/schemas/ActionSetBoardWorkflow"
        - $ref: "#/components/schemas/ActionArchiveBoard"
        - $ref: "#/components/schemas/ActionUnarchiveBoard"
        - $ref: "#/components/schemas/ActionLegacy"
      discriminator:
        propertyName: type
    ActionBase:
      type: object
      properties:
        at:
          type: integer
          description: Command clock in Unix ms; the server stamps it when omitted.
        boardId:
          type: string
          description: Board id; the server fills it when omitted.
    ActionLegacy:
      type: object
      description: |
        Browser undo/import actions beyond the core write path. They are part
        of the shared reducer but not modelled field-by-field here; the same
        command validator enforces their shape. `RESTORE_*` is refused to any
        PAT, and `RESTORE_BOARD` is rejected by `/commands` entirely.
      required: [type]
      properties:
        type:
          type: string
          enum:
            - RESTORE_CARD
            - RESTORE_COLUMN
            - RESTORE_LABEL
            - RESTORE_CHECKLIST
            - RESTORE_CHECKLIST_ITEM
            - RESTORE_COLUMN_CARDS
            - RESTORE_BOARD
            - IMPORT_BOARDS
            - ADD_BOARD
            - REMOVE_BOARD

name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a new push cancels the previous, still-running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege — the workflow only reads the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Shared tests (with coverage gate)
        run: npm run test:coverage -w shared

      - name: UI tests (with coverage gate)
        run: npm run test:coverage -w ui

      # `npm run build -w ui` runs `tsc -b` first (which also type-checks
      # `shared/`), so a dedicated typecheck step would duplicate the work.
      - name: Build (ui)
        run: npm run build -w ui

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Bundle budget (size-limit)
        run: npm run size -w ui

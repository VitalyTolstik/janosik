name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --force

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Bundle budget (size-limit)
        run: npx size-limit

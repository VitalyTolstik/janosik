name: perf-nightly

# TASK-200.1 placeholder: mock-only smoke, no secrets and no real API.
# The full S1–S6 baseline runs on a dedicated host (see scripts/perf/README.md);
# this job only keeps the harness and its contracts from rotting.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  mock-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run perf:lint
      - run: npm run perf:test
      - run: npm run perf:smoke
      - run: npm run perf:mcp-smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-smoke-results
          path: scripts/perf/results/
          retention-days: 7

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      # Each browser test supplies its own forwarded IP for rate-limit isolation.
      TRUST_PROXY: "1"
    depends_on:
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.27.2
    ports:
      - "127.0.0.1:${E2E_MAIL_PORT:-4802}:8025"
